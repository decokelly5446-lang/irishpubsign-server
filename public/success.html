<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #C9A84C;
    --dark: #0D0A06;
    --cream: #F2ECD8;
  }
  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  .logo {
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 2.5rem;
    text-decoration: none;
  }
  .checkmark {
    font-size: 3.5rem;
    margin-bottom: 1.5rem;
  }
  h1 {
    font-family: 'Georgia', serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: var(--gold);
    margin-bottom: 1rem;
    font-weight: normal;
  }
  p {
    font-size: 1.05rem;

  .divider {

<body>
<a href="/" class="logo">IrishPubSign.com</a>
<div class="checkmark">🍺</div>
<h1>Your order is confirmed</h1>
<p>Thanks for your order. You'll receive a confirmation email shortly.</p>
<p>Your personalised pub sign will be printed and shipped within <strong>3–5 working days</strong>.</p>
<div class="divider"></div>
<p style="font-size:0.9rem;">Questions? Email us at <a href="mailto:orders@irishpubsign.com" style="color:var(--gold);">orders@irishpubsign.com</a></p>
<a href="/" class="btn">Back to Home</a>

<script>
// Fire Meta Pixel Purchase event
// Retrieve order value from sessionStorage (set at InitiateCheckout) or default
(function() {
  try {
    var orderData = JSON.parse(sessionStorage.getItem('ips_order') || '{}');
    var value = orderData.value || 0;
    var product = orderData.product || 'unknown';
    var size = orderData.size || 'A3';

    // Get session_id from URL for deduplication
    var params = new URLSearchParams(window.location.search);
    var sessionId = params.get('session_id') || '';

    if (typeof fbq !== 'undefined') {
      fbq('track', 'Purchase', {
        value: value,
        currency: 'EUR',
        content_type: 'product',
        content_ids: [product + '_' + size],
        num_items: 1,
        order_id: sessionId
      });
    }
    // Clear stored order data
    sessionStorage.removeItem('ips_order');
  } catch(e) {}
})();
</script>
</body>
